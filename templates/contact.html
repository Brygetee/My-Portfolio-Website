{% extends "base.html" %}
{% block title %}Portfolio{% endblock %}

{% block content %}
<!-- Contact Form -->
<div class="contact-form-container">
    <form id="contactForm" method="post" name="sentMessage" action="{{url_for('contact')}}">
        <h1>Get In Touch</h1>

        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="First and Last name" required>
<br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Your Email" required>
<br>
        <label for="phone">Phone:</label>
        <input type="text" id="phone" name="phone" placeholder="Optional">
<br>
        <label for="message">Message:</label>
        <textarea id="message" name="message" placeholder="Your message here!" required></textarea>
<br>
        <button type="submit">Send</button>
    </form>
</div>
{% endblock %}
